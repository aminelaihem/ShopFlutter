name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # Job de validation du code
  validate:
    name: Validation du code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Configuration de Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: Récupération des dépendances
      run: flutter pub get
      
    - name: Vérification du formatage
      run: flutter format --set-exit-if-changed
      
    - name: Analyse statique
      run: flutter analyze
      
    - name: Tests unitaires avec couverture
      run: flutter test --coverage
      
    - name: Vérification de la couverture de code
      run: |
        # Installation de lcov pour analyser la couverture
        sudo apt-get install lcov
        
        # Génération du rapport de couverture
        lcov --summary coverage/lcov.info
        
        # Extraction du pourcentage de couverture
        COVERAGE=$(lcov --summary coverage/lcov.info | grep -o '[0-9]*\.[0-9]*%' | head -1 | sed 's/%//')
        echo "Couverture actuelle: ${COVERAGE}%"
        
        # Vérification que la couverture est >= 50%
        if (( $(echo "$COVERAGE < 50" | bc -l) )); then
          echo "❌ La couverture de code est de ${COVERAGE}%, mais doit être >= 50%"
          exit 1
        else
          echo "✅ Couverture de code: ${COVERAGE}% (>= 50%)"
        fi

  # Job de build et déploiement
  build-and-deploy:
    name: Build et Déploiement
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Configuration de Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true
        
    - name: Récupération des dépendances
      run: flutter pub get
      
    - name: Build pour le web
      run: flutter build web --release
      
    - name: Upload des artefacts de build
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: build/web/
        retention-days: 30

  # Job de déploiement sur Vercel
  deploy:
    name: Déploiement Vercel
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Configuration de Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Installation de Vercel CLI
      run: npm install -g vercel@latest
      
    - name: Configuration Vercel
      run: |
        echo "Configuring Vercel..."
        vercel --token ${{ secrets.VERCEL_TOKEN }} --yes
        
    - name: Déploiement sur Vercel
      run: |
        echo "🚀 Déploiement sur Vercel..."
        
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          # Déploiement en production
          vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
          echo "✅ Déploiement en production terminé"
        else
          # Déploiement en preview
          vercel --token ${{ secrets.VERCEL_TOKEN }} --yes
          echo "✅ Déploiement en preview terminé"
        fi
        
    - name: Commentaire sur la PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('🚀 Déploiement')
          );
          
          const commentBody = `🚀 **Déploiement terminé avec succès !**
          
          📊 **Résultats:**
          - ✅ Validation du code réussie
          - ✅ Tests passés avec couverture >= 50%
          - ✅ Build web réussi
          - ✅ Déploiement Vercel terminé
          
          🌐 **Application déployée:** [Voir l'application](https://shopflutter.vercel.app)
          
          📝 **Type:** Preview Branch`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              issue_number: context.issue.number,
              comment_id: botComment.id,
              body: commentBody
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              issue_number: context.issue.number,
              body: commentBody
            });
          }
